[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "questionnaire-host"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["answer-cache-agent==0.1.0"]
[project.scripts]
questionnaire-host = "questionnaire_host.native:main"
[tool.setuptools.package-data]
questionnaire_host = ["contract.json", "allowed-origins.json"]
